name: Build & Push Docker Image

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract model weights from previous image
        run: |
          mkdir -p model/weights
          docker pull amalsalilan/safety-eye:latest
          docker create --name tmp_model amalsalilan/safety-eye:latest
          docker cp tmp_model:/app/model/weights/best.onnx model/weights/best.onnx
          docker rm tmp_model
          echo "Model size: $(du -sh model/weights/best.onnx)"

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            amalsalilan/safety-eye:latest
            amalsalilan/safety-eye:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
